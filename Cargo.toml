[package]
name = "ccsearch"
version = "0.1.0"
edition = "2021"
description = "Search your local Claude Code conversation history"
license = "MIT"

[[bin]]
name = "ccsearch"
path = "src/main.rs"

[lib]
name = "ccsearch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"

[dev-dependencies]
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
